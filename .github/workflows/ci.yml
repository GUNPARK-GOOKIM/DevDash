name: Continuous Integration & Automated Tests

on:
  push:
    branches:
      - main
      - master
      - test
  pull_request:
    branches:
      - main
      - master
      - test
  workflow_dispatch:

jobs:
  check-frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: TypeScript Check & Vite Build
        run: npm run build

  test-backend:
    name: Rust Core Engine Tests (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Cargo Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Backend Unit & Integration Tests (GUI + CLI modules)
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml --features cli

      - name: Build DevDash CLI binary
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin devdash --features cli

  build-cli:
    name: DevDash CLI (no WebKit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install build tools (no WebKit/GTK)
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev

      - name: Build CLI without Tauri/WebKit
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin devdash --no-default-features --features cli

      - name: CLI smoke (--help / version)
        run: |
          ./src-tauri/target/debug/devdash --help
          ./src-tauri/target/debug/devdash version
