# Cargo package metadata manifest file for DevDash Tauri backend
[package] # Declare package configuration section
name = "devdash_backend" # Package identifier name
version = "1.0.1" # Semver release version
edition = "2021" # Use modern Rust 2021 edition standards
description = "Fast, minimal Rust backend engine for DevDash database GUI" # Brief description of backend crate

# Package binary targets setup
[[bin]] # Target configuration for executable binary
name = "devdash_backend" # Binary name output
path = "src/main.rs" # Path to main entry point file

# Dependencies required for compiling DevDash backend
[dependencies] # Production dependencies section
tauri = { version = "2.0", features = [] } # Tauri 2.0 desktop framework core crate
serde = { version = "1.0", features = ["derive"] } # Serde object serialization and deserialization macros
serde_json = "1.0" # Serde JSON format parsing and encoding support
tokio = { version = "1.0", features = ["full"] } # Tokio asynchronous runtime for async I/O and tasks
sqlx = { version = "0.8", features = ["any", "runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite", "chrono", "uuid", "rust_decimal"] } # Multi-driver async SQL database client library
keyring = "3.0" # Native OS Keychain and Secret Manager credential isolation store
uuid = { version = "1.0", features = ["v4", "serde"] } # Universal Unique Identifier generation library
chrono = { version = "0.4", features = ["serde"] } # Date and time representation library with serde support
dashmap = "6.0" # Concurrent thread-safe hash map for multi-pool connection state
dirs = "6.0" # User config directory locator
csv = "1.3" # Fast CSV parsing and encoding crate
base64 = "0.22" # Base64 encoding/decoding crate
aes-gcm = "0.10" # AES-256-GCM authenticated encryption for secure connection exports
pbkdf2 = "0.12" # Key derivation for passphrase encryption
hmac = "0.12" # HMAC support for PBKDF2
sha2 = "0.10" # SHA-256 hashing for PBKDF2
ssh2 = "0.9" # Native SSH2 protocol library for SSH tunnel port forwarding
futures-util = "0.3" # StreamExt for sqlx row streaming
tiberius = "0.12.3"
bb8 = "0.9.1"
bb8-tiberius = "0.16.0"
tokio-util = "0.7.19"
rust_decimal = "1.42.1"
mongodb = "3.1"
redis = { version = "0.27", features = ["tokio-comp"] }
scylla = "0.14"
clickhouse = "0.12"

# Build configuration dependencies
[build-dependencies] # Build dependencies section
tauri-build = { version = "2.0", features = [] }
